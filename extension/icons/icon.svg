<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Easy WebBridge</title>
  <desc id="desc">An E-shaped bridge connecting two endpoints</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174CFF"/>
      <stop offset="0.55" stop-color="#2720D8"/>
      <stop offset="1" stop-color="#5A0BC8"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9F0FF"/>
      <stop offset="1" stop-color="#D9C6FF"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#258CFF"/>
      <stop offset="1" stop-color="#19E7FF"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect x="23" y="24" width="15" height="80" rx="7.5" fill="url(#letter)"/>
  <rect x="23" y="24" width="80" height="22" rx="11" fill="url(#letter)"/>
  <rect x="23" y="82" width="80" height="22" rx="11" fill="url(#letter)"/>
  <path d="M35 74c8-4 17-6 30-6s22 2 30 6" fill="none" stroke="url(#bridge)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="35" cy="74" r="10" fill="#258CFF"/>
  <circle cx="95" cy="74" r="10" fill="#19E7FF"/>
</svg>
